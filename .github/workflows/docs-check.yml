name: "Docs link check"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  workflow_dispatch:
  # Links break without any change in eGo, so check them weekly as well.
  schedule:
    - cron: "0 5 * * 1"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same Python and packages as the Read the Docs build
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "setuptools<82"

      - name: Check doc links
        run: sphinx-build . -b linkcheck -d _build/doctrees _build/linkcheck
        working-directory: ./doc
        env:
          READTHEDOCS: "True"
